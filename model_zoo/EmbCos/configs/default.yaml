# MLPs
d_hidden: 1024
d_shared: 256
n_hidden_layers_ms: 3
n_hidden_layers_mol: 0
dropout: 0.25
layernorm: True

# Encoders
fingerprint_size: 4096
bin_width: 0.1
max_mz: 1005

# Training
lr: 0.0001
weight_decay: 0.00005
n_warmup_steps: 2000
n_max_steps: 16000

# Loss
k_candidates: 32
batch_size: 64

# Hardware concerns
n_workers: 8
batch_size_eval: 16
