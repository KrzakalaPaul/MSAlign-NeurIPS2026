# Fast end-to-end check of MSAlign fusion on SpectraVerse formula_seed1.
# It combines one alignment model with the three mass resolutions used in the
# paper, avoiding the three additional representation-pair checkpoints.
cache_dir: cache/MSAlign_fusion
formula_filter: false

evaluation_targets:
  - labelled_dataset_name: spectraverse
    candidate_map_name: 256_candidates_by_mass
    split_method: formula_seed1

fit:
  temperature_min: 0.001
  temperature_max: 10.0
  n_temperature_values: 41
  n_workers: 4

scorers:
  - name: dreams_moldeberta
    type: msalign
    checkpoint: checkpoints/dreams_moldeberta
    batch_size: 16
    n_workers: 8
  - name: mass_ppm_0.1
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 0.1}
  - name: mass_ppm_1
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 1.0}
  - name: mass_ppm_10
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 10.0}

output_csv: results/fusion_smoke.csv
