# MSAlign^4M: four representation-pair models plus three mass resolutions.
# A directory-valued checkpoint is resolved as
#   <directory>/<dataset>__<candidate_map>__<split>.ckpt
cache_dir: cache/MSAlign_fusion
formula_filter: false

fit:
  # A convex listwise fit is repeated on a log-spaced temperature grid. The
  # temperature whose weights maximize validation R@1 is retained.
  temperature_min: 0.001
  temperature_max: 10.0
  n_temperature_values: 41
  n_workers: 4

scorers:
  - {name: dreams_moldeberta, type: msalign, checkpoint: checkpoints/dreams_moldeberta}
  - {name: dreams_fingerprint, type: msalign, checkpoint: checkpoints/dreams_fingerprint}
  - {name: bins_moldeberta, type: msalign, checkpoint: checkpoints/bins_moldeberta}
  - {name: bins_fingerprint, type: msalign, checkpoint: checkpoints/bins_fingerprint}
  - name: mass_ppm_0.01
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 0.01}
  - name: mass_ppm_0.1
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 0.1}
  - name: mass_ppm_1
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 1.0}
  - name: mass_ppm_10
    type: estimated_mass
    mass_score: {mass_error_unit: ppm, transform: gaussian, scale: 10.0}


output_csv: results/fusion.csv
